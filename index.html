<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the Word Challenge</title>
    <style>
        :root {
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --success: #10b981;
            --danger: #ef4444;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .game-container {
            background-color: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 620px;
            padding: 35px;
            text-align: center;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        header h1 {
            font-size: 1.9rem;
            color: var(--primary);
            margin-bottom: 6px;
            font-weight: 700;
        }

        header p {
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 24px;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: #f8fafc;
            border: 1px solid var(--border-color);
            padding: 12px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 0.95rem;
            font-weight: 600;
        }

        .hint-box {
            background: rgba(79, 70, 229, 0.06);
            border: 1px solid rgba(79, 70, 229, 0.2);
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 25px;
            color: #312e81;
            font-size: 1.05rem;
            line-height: 1.5;
        }

        .word-display {
            font-size: 2.4rem;
            letter-spacing: 12px;
            font-weight: bold;
            margin: 30px 0;
            color: var(--text-dark);
            direction: ltr;
            unicode-bidi: embed;
        }

        .keyboard {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        @media (max-width: 480px) {
            .keyboard {
                grid-template-columns: repeat(5, 1fr);
            }
        }

        .key-btn {
            background-color: #f1f5f9;
            color: var(--text-dark);
            border: 1px solid var(--border-color);
            padding: 12px 0;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .key-btn:hover:not(:disabled) {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .key-btn:disabled {
            background-color: #e2e8f0;
            color: #94a3b8;
            cursor: not-allowed;
            border-color: #cbd5e1;
        }

        .message-box {
            font-size: 1.1rem;
            font-weight: bold;
            min-height: 30px;
            margin-bottom: 15px;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: #e2e8f0;
            color: var(--text-dark);
        }

        .btn-secondary:hover {
            background-color: #cbd5e1;
        }

        .modal {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.9);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            z-index: 10;
            color: white;
        }

        .modal h2 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            color: #ffffff;
        }

        .modal p {
            color: #cbd5e1;
            margin-bottom: 25px;
            font-size: 1.15rem;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <header>
            <h1>Guess the Word 🎮</h1>
            <p>Interactive Vocabulary Challenge</p>
        </header>

        <div class="stats-bar">
            <span>Word: <strong id="current-word-num">1</strong> / 15</span>
            <span>Attempts Left: <strong id="attempts-left" style="color: var(--success);">6</strong></span>
        </div>

        <div class="hint-box" id="hint-text">
            Loading hint...
        </div>

        <div class="word-display" id="word-display">
            _ _ _ _ _
        </div>

        <div class="message-box" id="game-message"></div>

        <div class="keyboard" id="keyboard"></div>

        <div class="controls">
            <button class="btn btn-secondary" onclick="resetGame()">Reset Game</button>
        </div>

        <div class="modal" id="end-modal">
            <h2 id="modal-title">🏆 Victory! Challenge Completed</h2>
            <p id="modal-desc">You have successfully completed all 15 words.</p>
            <button class="btn" onclick="restartEntireGame()">Play Again</button>
        </div>
    </div>

    <script>
        const wordsList = [
            { word: "benefit", hint: "An advantage or profit gained from something." },
            { word: "clue", hint: "A piece of evidence or information used in solving a mystery." },
            { word: "positive", hint: "Constructive, optimistic, or confident." },
            { word: "prize", hint: "A thing given as a reward to the winner of a competition." },
            { word: "react", hint: "Act in response to something; respond." },
            { word: "useful", hint: "Able to be used for a practical purpose." },
            { word: "team building", hint: "The action of causing people to work together effectively (two words, keep a space)." },
            { word: "stressful", hint: "Causing mental or emotional stress." },
            { word: "reward", hint: "A thing given in recognition of service or effort." },
            { word: "problem solving", hint: "The process of finding solutions to complex issues (two words)." },
            { word: "object", hint: "A material thing that can be seen and touched." },
            { word: "comparative", hint: "Estimated by similarity or dissimilarity between things." },
            { word: "cooperative", hint: "Involving mutual assistance toward a common goal." },
            { word: "developer", hint: "A person who develops computer programs or applications." },
            { word: "entertainment", hint: "The action of providing amusement or enjoyment." }
        ];

        let currentIndex = 0;
        let selectedData = {};
        let guessedLetters = [];
        let attemptsLeft = 6;
        let score = 0;

        const wordDisplay = document.getElementById("word-display");
        const hintText = document.getElementById("hint-text");
        const attemptsEl = document.getElementById("attempts-left");
        const currentWordNumEl = document.getElementById("current-word-num");
        const gameMessage = document.getElementById("game-message");
        const keyboardEl = document.getElementById("keyboard");
        const endModal = document.getElementById("end-modal");
        const modalTitle = document.getElementById("modal-title");
        const modalDesc = document.getElementById("modal-desc");

        function initGame() {
            if (currentIndex >= wordsList.length) {
                showEndScreen();
                return;
            }

            selectedData = wordsList[currentIndex];
            guessedLetters = [];
            attemptsLeft = 6;
            
            currentWordNumEl.innerText = currentIndex + 1;
            attemptsEl.innerText = attemptsLeft;
            attemptsEl.style.color = "var(--success)";
            hintText.innerText = `💡 Hint: ${selectedData.hint}`;
            gameMessage.innerText = "";

            updateWordDisplay();
            createKeyboard();
        }

        function updateWordDisplay() {
            let displayString = "";
            let solved = true;

            for (let char of selectedData.word) {
                if (char === " ") {
                    displayString += " &nbsp; ";
                } else if (guessedLetters.includes(char)) {
                    displayString += char + " ";
                } else {
                    displayString += "_ ";
                    solved = false;
                }
            }

            wordDisplay.innerHTML = displayString;

            if (solved) {
                gameMessage.style.color = "var(--success)";
                gameMessage.innerText = "✨ Excellent! Moving to the next word...";
                score++;
                disableAllKeys();
                setTimeout(() => {
                    currentIndex++;
                    initGame();
                }, 1500);
            }
        }

        function createKeyboard() {
            keyboardEl.innerHTML = "";
            const alphabet = "abcdefghijklmnopqrstuvwxyz";

            for (let letter of alphabet) {
                const btn = document.createElement("button");
                btn.classList.add("key-btn");
                btn.innerText = letter.toUpperCase();
                btn.onclick = () => handleGuess(letter, btn);
                keyboardEl.appendChild(btn);
            }
        }

        function handleGuess(letter, btn) {
            btn.disabled = true;
            guessedLetters.push(letter);

            if (selectedData.word.includes(letter)) {
                btn.style.backgroundColor = "var(--success)";
                btn.style.color = "white";
                btn.style.borderColor = "var(--success)";
                updateWordDisplay();
            } else {
                attemptsLeft--;
                attemptsEl.innerText = attemptsLeft;
                if (attemptsLeft <= 2) {
                    attemptsEl.style.color = "var(--danger)";
                }
                
                if (attemptsLeft === 0) {
                    gameMessage.style.color = "var(--danger)";
                    gameMessage.innerText = `❌ Out of attempts! The word was: ${selectedData.word}`;
                    disableAllKeys();
                    setTimeout(() => {
                        currentIndex++;
                        initGame();
                    }, 2500);
                }
            }
        }

        function disableAllKeys() {
            const buttons = keyboardEl.querySelectorAll("button");
            buttons.forEach(btn => btn.disabled = true);
        }

        function showEndScreen() {
            endModal.style.display = "flex";
            modalTitle.innerText = "🏆 Victory! Challenge Completed";
            modalDesc.innerText = `You have successfully completed all 15 words.`;
        }

        function resetGame() {
            currentIndex = 0;
            score = 0;
            endModal.style.display = "none";
            initGame();
        }

        function restartEntireGame() {
            resetGame();
        }

        initGame();
    </script>
</body>
</html>
